name: Notify Mattermost about council meetings

on:
  schedule:
    # Keep already-published weekly digests up to date.
    - cron: "17 */4 * * *"
    # Publish next week's digest on Friday evening, including daylight saving.
    - cron: "0 18 * * 5"
      timezone: Europe/Warsaw
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lublin-district-mattermost-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Scrape meetings and notify Mattermost
        env:
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
        run: python mattermost_notifier.py
